{% load static %}

<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="{% static 'tickets/css/tickets.css' %}">

    <title>Delete Ticket | Bug Tracker</title>

</head>

<body>

<div class="container">

    <div class="form-card">

        <h1>Delete Ticket</h1>

        <p>
            Are you sure you want to delete this ticket?
        </p>

        <h3>{{ ticket.title }}</h3>

        <p>{{ ticket.description }}</p>

        <form method="POST">

            {% csrf_token %}

            <button
                type="submit"
                class="btn btn-danger">

                Yes, Delete Ticket

            </button>

        </form>

        <br>

        <a
            href="{% url 'tickets:detail' ticket.pk %}"
            class="btn btn-primary">

            Cancel

        </a>

    </div>

</div>

</body>

</html>
