{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ project.name }} | Bug Tracker</title>
  </head>
  <body>
    <h1>{{ project.name }}</h1>

    <p>{{ project.description }}</p>

    <p>Owner: {{ project.owner.username }}</p>

    <p>Created: {{ project.created_at }}</p>

    <a href="{% url 'projects:edit' project.pk %}"> Edit Project </a>
    <a href="{% url 'projects:delete' project.pk %}"> Delete Project </a>
  </body>
</html>
