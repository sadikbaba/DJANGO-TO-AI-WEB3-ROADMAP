{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delete Project | Bug Tracker</title>
  </head>
  <body>
    <h1>Delete Project</h1>

    <p>Are you sure you want to delete this project?</p>

    <h3>{{ project.name }}</h3>

    <p>{{ project.description }}</p>

    <form method="POST">
      {% csrf_token %}

      <button type="submit">Yes, Delete Project</button>
    </form>

    <a href="{% url 'projects:detail' project.pk %}"> Cancel </a>
  </body>
</html>
